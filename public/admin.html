<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel de Agendamentos · ER</title>
<meta name="theme-color" content="#EADAD4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--rose:#B76E79;--rose-light:#E6B8A9;--black:#080808;--nude:#F3E3DE;--off:#FFF9F6;--rose-deep:#8E4F59;--malva:#C9A89E;--malva-soft:#EADAD4;--cacau:#4A3532;--ink:#2a1f20;--muted:#7d6a68;
  --metal:linear-gradient(115deg,#8E4F59 0%,#B76E79 22%,#F4D2C6 42%,#C98B8F 55%,#E6B8A9 72%,#8E4F59 100%);
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-weight:300;background:var(--off);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
header{background:var(--malva-soft);color:var(--cacau);border-bottom:1px solid rgba(183,110,121,.25);padding:calc(18px + env(safe-area-inset-top)) 20px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
header img{width:54px}
header h1{font-family:var(--serif);font-weight:500;font-size:1.35rem;flex:1;line-height:1.1}
header h1 small{display:block;font-family:var(--sans);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--rose);font-weight:400}
.ghost{all:unset;cursor:pointer;font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rose-deep);border:1px solid rgba(183,110,121,.45);border-radius:999px;padding:9px 14px}
main{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.login{max-width:360px;margin:12vh auto 0;text-align:center}
.login h2{font-family:var(--serif);font-weight:500;font-size:2rem;margin-bottom:6px}
.login p{color:var(--muted);font-size:.85rem;margin-bottom:22px}
input,textarea{width:100%;border:1px solid rgba(183,110,121,.4);border-radius:12px;padding:14px 16px;font:400 16px var(--sans);background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--rose)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border-radius:999px;background:var(--metal);background-size:180% 100%;color:var(--cacau);font-weight:500;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase}
.login .btn{width:100%;margin-top:12px}
.err{color:#b4424f;font-size:.85rem;margin-top:12px;min-height:1em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:#fff;border:1px solid rgba(183,110,121,.2);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.8rem;font-weight:500;color:var(--rose-deep);line-height:1}
.stat span{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{all:unset;cursor:pointer;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;padding:9px 14px;border-radius:999px;border:1px solid rgba(183,110,121,.35);color:var(--rose-deep)}
.tab.on{background:var(--rose-deep);color:#fff;border-color:var(--rose-deep)}
.day{background:#fff;border:1px solid rgba(183,110,121,.18);border-radius:18px;margin-bottom:14px;overflow:hidden}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--nude)}
.day-h h3{font-family:var(--serif);font-weight:500;font-size:1.25rem;text-transform:capitalize}
.day-h h3 small{font-family:var(--sans);font-size:.62rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-left:6px}
.mini{all:unset;cursor:pointer;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep);border:1px solid rgba(183,110,121,.4);border-radius:999px;padding:7px 11px;white-space:nowrap}
.mini.danger{color:#a23a47;border-color:rgba(162,58,71,.4)}
.slot{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid rgba(183,110,121,.12)}
.slot .t{font-family:var(--serif);font-size:1.1rem;width:92px;flex:none}
.slot .who{flex:1;font-size:.85rem;line-height:1.45;min-width:0}
.slot .who b{font-weight:500}
.slot .who a{color:var(--rose-deep);text-decoration:underline}
.slot .who em{display:block;font-style:normal;color:var(--muted);font-size:.78rem}
.tag{display:inline-block;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.tag.livre{background:#eef6ee;color:#3d7a4a}.tag.res{background:var(--rose-deep);color:#fff}.tag.blq{background:#f1e6e4;color:var(--muted)}
.slot.past{opacity:.45}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,250%);opacity:0;background:var(--cacau);color:#fff;padding:12px 20px;border-radius:999px;font-size:.8rem;transition:transform .4s;z-index:9}
.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:480px){.slot{flex-wrap:wrap}.slot .who{flex-basis:calc(100% - 104px)}.slot .acts{width:100%;display:flex;justify-content:flex-end}}
</style>
</head>
<body>
<header>
  <img src="img/logo.png" alt="ER">
  <h1><small>Painel</small>Agendamentos</h1>
  <button class="ghost" id="sair" hidden>Sair</button>
</header>
<main id="app">
  <form class="login" id="login">
    <h2>Acesso restrito</h2>
    <p>Digite a senha do painel para ver e gerenciar os agendamentos.</p>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
    <button class="btn" type="submit">Entrar</button>
    <p class="err" id="lerr"></p>
  </form>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const SEM = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
  const parse = d => { const [y,m,dd] = d.split("-").map(Number); return new Date(Date.UTC(y,m-1,dd)); };
  const fmt = d => { const x = parse(d); return SEM[x.getUTCDay()] + "<small>" + String(x.getUTCDate()).padStart(2,"0") + "/" + String(x.getUTCMonth()+1).padStart(2,"0") + "</small>"; };
  const hh = t => t.replace(":00","h");
  const telFmt = t => t.length === 11 ? "(" + t.slice(0,2) + ") " + t.slice(2,7) + "-" + t.slice(7) : t;
  let senha = ""; try { senha = sessionStorage.getItem("er_senha") || ""; } catch(e) {}
  let dados = null, aba = "proximos";

  function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2200); }

  async function api(body){
    const r = await fetch("/api/admin", {method:"POST", headers:{"content-type":"application/json","x-admin-senha":senha}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if(r.status === 401){ if(dados) sair(); throw new Error("Senha incorreta."); }
    if(!r.ok) throw new Error(j.erro || "Erro ao comunicar com o servidor.");
    return j;
  }

  async function carregar(){
    try { dados = await api({acao:"listar"}); render(); }
    catch(e){ if(!senha) $("lerr").textContent = e.message; else toast(e.message); }
  }

  function render(){
    $("sair").hidden = false;
    const hoje = new Date(Date.now() - 3*3600e3).toISOString().slice(0,10);
    const futuros = dados.dias.filter(d => d.data >= hoje);
    let res = 0, livres = 0, hojeN = 0;
    futuros.forEach(d => d.slots.forEach(s => {
      if(s.registro && s.registro.tipo === "reserva" && !s.passado){ res++; if(d.data === hoje) hojeN++; }
      if(!s.registro && !s.passado) livres++;
    }));
    let dias = aba === "proximos" ? futuros.filter(d => d.slots.some(s => s.registro && s.registro.tipo === "reserva"))
             : aba === "agenda" ? futuros : dados.dias.filter(d => d.data < hoje).reverse();
    let html = '<div class="stats"><div class="stat"><b>' + hojeN + '</b><span>Hoje</span></div><div class="stat"><b>' + res +
      '</b><span>Reservas</span></div><div class="stat"><b>' + livres + '</b><span>Livres</span></div></div>' +
      '<div class="tabs"><button class="tab' + (aba==="proximos"?" on":"") + '" data-aba="proximos">Reservas</button><button class="tab' + (aba==="agenda"?" on":"") +
      '" data-aba="agenda">Agenda completa</button><button class="tab' + (aba==="passados"?" on":"") + '" data-aba="passados">Anteriores</button></div>';
    if(!dias.length) html += '<p class="empty">' + (aba === "proximos" ? "Nenhuma reserva por enquanto." : "Nada por aqui.") + '</p>';
    dias.forEach(d => {
      const temBloq = d.slots.some(s => s.registro && s.registro.tipo === "bloqueio");
      const temLivre = d.slots.some(s => !s.registro && !s.passado);
      html += '<div class="day"><div class="day-h"><h3>' + fmt(d.data) + '</h3>' +
        (aba === "agenda" ? (temLivre ? '<button class="mini" data-a="bloquearDia" data-d="' + d.data + '">Bloquear dia</button>' :
          temBloq ? '<button class="mini" data-a="desbloquearDia" data-d="' + d.data + '">Liberar dia</button>' : '') : '') + '</div>';
      d.slots.forEach(s => {
        const r = s.registro;
        if(aba === "proximos" && !(r && r.tipo === "reserva")) return;
        let who = '<span class="tag livre">Livre</span>', act = '';
        if(r && r.tipo === "reserva"){
          who = '<span class="tag res">Reserva</span><b>' + esc(r.nome) + '</b> · <a href="https://wa.me/55' + r.telefone.replace(/^55/,"") + '" target="_blank" rel="noopener">' + telFmt(r.telefone) + '</a><em>' + r.servicos.map(esc).join(" + ") + '</em>';
          if(!s.passado) act = '<button class="mini danger" data-a="cancelar" data-d="' + d.data + '" data-i="' + s.inicio + '">Cancelar</button>';
        } else if(r){
          who = '<span class="tag blq">Bloqueado</span>' + (r.nota ? '<em>' + esc(r.nota) + '</em>' : '');
          if(!s.passado) act = '<button class="mini" data-a="desbloquear" data-d="' + d.data + '" data-i="' + s.inicio + '">Liberar</button>';
        } else if(!s.passado){
          act = '<button class="mini" data-a="bloquear" data-d="' + d.data + '" data-i="' + s.inicio + '">Bloquear</button>';
        }
        html += '<div class="slot' + (s.passado ? " past" : "") + '"><span class="t">' + hh(s.inicio) + '–' + hh(s.fim) + '</span><div class="who">' + who + '</div><div class="acts">' + act + '</div></div>';
      });
      html += '</div>';
    });
    $("app").innerHTML = html;
  }
  function esc(t){ return String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  $("app").addEventListener("click", async e => {
    const t = e.target.closest("[data-aba]"); if(t){ aba = t.dataset.aba; render(); return; }
    const b = e.target.closest("[data-a]"); if(!b) return;
    const a = b.dataset.a, body = {acao: a, data: b.dataset.d, inicio: b.dataset.i};
    const msgs = {cancelar:"Cancelar esta reserva? O horário ficará livre para outras clientes.", bloquearDia:"Bloquear todos os horários livres deste dia?", desbloquearDia:"Liberar os horários bloqueados deste dia?"};
    if(msgs[a] && !confirm(msgs[a])) return;
    if(a === "bloquear"){ const n = prompt("Motivo do bloqueio (opcional). Ex.: cliente agendou por telefone", ""); if(n === null) return; body.nota = n; }
    b.disabled = true; b.textContent = "…";
    try { await api(body); toast("Pronto!"); await carregar(); } catch(err){ toast(err.message); b.disabled = false; }
  });

  $("login").addEventListener("submit", async e => {
    e.preventDefault(); senha = $("senha").value; $("lerr").textContent = "";
    try { dados = await api({acao:"listar"}); try { sessionStorage.setItem("er_senha", senha); } catch(_) {} render(); }
    catch(err){ $("lerr").textContent = err.message; senha = ""; }
  });
  function sair(){ senha = ""; try { sessionStorage.removeItem("er_senha"); } catch(e) {} location.reload(); }
  $("sair").onclick = sair;
  if(senha) carregar();
})();
</script>
</body>
</html>
